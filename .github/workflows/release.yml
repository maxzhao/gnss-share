name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build"
        required: true

permissions:
  contents: write

env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Determine version
      id: version
      run: |
        if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          VERSION=${{ github.event.inputs.tag }}
        else
          VERSION=${{ github.ref_name }}
        fi
        echo "version=${VERSION}" >> $GITHUB_OUTPUT
        echo "version=${VERSION}"

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v2

    - name: Install native build tools
      run: sdkmanager "ndk;28.2.13676358" "cmake;3.22.1"

    - name: Install test signing key
      env:
        TEST_KEYSTORE_BASE64: ${{ secrets.TEST_KEYSTORE_BASE64 }}
      run: |
        mkdir -p "$HOME/.android"
        printf '%s' "$TEST_KEYSTORE_BASE64" | base64 -d > "$HOME/.android/debug.keystore"
        chmod 600 "$HOME/.android/debug.keystore"

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Build test-signed release APKs
      env:
        VERSION_NAME: ${{ steps.version.outputs.version }}
      run: |
        ./gradlew assembleRelease -PtestSigning=true

    - name: Prepare release notes
      id: release-notes
      env:
        VERSION_NAME: ${{ steps.version.outputs.version }}
      run: |
        NOTES_PATH=".github/release-notes/${VERSION_NAME}.md"
        if [[ ! -f "${NOTES_PATH}" ]]; then
          NOTES_PATH="${RUNNER_TEMP}/release-notes.md"
          printf 'Changes in `%s`.\n' "${VERSION_NAME}" > "${NOTES_PATH}"
        fi
        echo "path=${NOTES_PATH}" >> "$GITHUB_OUTPUT"

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.version.outputs.version }}
        name: Release ${{ steps.version.outputs.version }}
        body_path: ${{ steps.release-notes.outputs.path }}
        draft: false
        prerelease: false
        fail_on_unmatched_files: true
        files: |
          client-app/build/outputs/apk/release/gnss-client-${{ steps.version.outputs.version }}-universal.apk
          server-app/build/outputs/apk/release/gnss-server-${{ steps.version.outputs.version }}-*.apk
